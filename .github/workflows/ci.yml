name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests scikit-learn

    - name: Run Unit Tests
      env:
        PYTHONPATH: .
        GEMINI_API_KEY: mock_ci_test_key
      run: |
        pytest tests/ -v
